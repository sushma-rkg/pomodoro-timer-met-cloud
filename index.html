<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomodoro Art</title>
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
  <div id="app">
    <h1>Pomodoro Art</h1>
    <div id="painting-frame">
      <p id="loading-msg">Loading…</p>
      <img id="painting" src="" alt="painting" hidden>
      <div id="error-msg" hidden>
        <p>Couldn't load a painting. Please try again.</p>
        <button id="btn-try-again">Try again</button>
      </div>
    </div>
    <p id="painting-title"></p>
    <div id="art-info" hidden>
      <p id="info-title"></p>
      <p id="info-artist"></p>
      <p id="info-year"></p>
      <a id="info-link" href="#" target="_blank" rel="noopener">Learn more at The Met</a>
    </div>
    <div id="display">00:00</div>
    <div id="controls">
      <button id="btn-start">Start</button>
      <button id="btn-pause" hidden>Pause</button>
      <button id="btn-resume" hidden>Resume</button>
      <button id="btn-reset" hidden>Reset</button>
    </div>
    <p id="done-msg" hidden>Done!</p>
  </div>
  <script src="script.js?v=4"></script>
</body>
</html>
